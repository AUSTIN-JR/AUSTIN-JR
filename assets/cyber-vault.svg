<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="120" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <filter id="vaultGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes rotateRingClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateRingCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseShieldCore {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px #8B5CF6); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 18px #EC4899); }
    }
    .ring-outer {
      transform-origin: 80px 80px;
      animation: rotateRingClockwise 12s linear infinite;
    }
    .ring-inner {
      transform-origin: 80px 80px;
      animation: rotateRingCounter 8s linear infinite;
    }
    .shield-core {
      transform-origin: 80px 80px;
      animation: pulseShieldCore 3s ease-in-out infinite;
    }
  </style>

  <!-- Outer Hex Orbit Ring -->
  <circle cx="80" cy="80" r="70" fill="none" stroke="#312E81" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6" />
  <circle cx="80" cy="80" r="62" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="24,12,6,12" class="ring-outer" />

  <!-- Inner Ring with Orbiting Nodes -->
  <g class="ring-inner">
    <circle cx="80" cy="80" r="48" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="16,8" opacity="0.8" />
    <circle cx="80" cy="32" r="3.5" fill="#38BDF8" filter="url(#vaultGlow)" />
    <circle cx="80" cy="128" r="3.5" fill="#38BDF8" filter="url(#vaultGlow)" />
  </g>

  <!-- Central Shield -->
  <g class="shield-core">
    <!-- Shield Geometry -->
    <path d="M 80 42 L 108 52 C 108 84 80 106 80 114 C 80 106 52 84 52 52 Z" 
          fill="url(#shieldGrad)" stroke="#A78BFA" stroke-width="2" filter="url(#vaultGlow)" />
    
    <!-- Lock Shackle & Body -->
    <path d="M 72 68 L 72 63 C 72 58.5 88 58.5 88 63 L 88 68" 
          fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <rect x="68" y="68" width="24" height="18" rx="4" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="80" cy="76" r="2.5" fill="#FFFFFF" />
    <line x1="80" y1="78" x2="80" y2="82" stroke="#FFFFFF" stroke-width="2" />
  </g>
</svg>
