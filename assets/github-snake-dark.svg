<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 150" width="100%" height="135">
  <defs>
    <filter id="neonGlowSnake" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes crawlSnake {
      0% { transform: translate(0, 0); }
      10% { transform: translate(120px, 0); }
      20% { transform: translate(120px, 32px); }
      35% { transform: translate(280px, 32px); }
      45% { transform: translate(280px, 64px); }
      60% { transform: translate(460px, 64px); }
      70% { transform: translate(460px, 16px); }
      85% { transform: translate(620px, 16px); }
      95% { transform: translate(620px, 80px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes pulseFood {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .food1 { animation: pulseFood 1.5s infinite; transform-origin: 190px 48px; }
    .food2 { animation: pulseFood 1.8s infinite 0.4s; transform-origin: 350px 80px; }
    .food3 { animation: pulseFood 2.1s infinite 0.8s; transform-origin: 530px 32px; }
    .food4 { animation: pulseFood 1.7s infinite 1.2s; transform-origin: 690px 96px; }
    .snake-body { animation: crawlSnake 12s linear infinite; }
  </style>

