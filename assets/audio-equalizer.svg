<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 60" width="100%" height="50">
  <defs>
    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="45%" stop-color="#8B5CF6" />
      <stop offset="80%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes bounce1 { 0%, 100% { height: 12px; y: 44px; } 50% { height: 42px; y: 14px; } }
    @keyframes bounce2 { 0%, 100% { height: 35px; y: 21px; } 50% { height: 16px; y: 40px; } }
    @keyframes bounce3 { 0%, 100% { height: 20px; y: 36px; } 50% { height: 48px; y: 8px; } }
    @keyframes bounce4 { 0%, 100% { height: 46px; y: 10px; } 50% { height: 24px; y: 32px; } }
    @keyframes bounce5 { 0%, 100% { height: 18px; y: 38px; } 50% { height: 38px; y: 18px; } }

    .b1 { animation: bounce1 1.2s ease-in-out infinite; }
    .b2 { animation: bounce2 0.9s ease-in-out infinite; }
    .b3 { animation: bounce3 1.4s ease-in-out infinite; }
    .b4 { animation: bounce4 1.1s ease-in-out infinite; }
    .b5 { animation: bounce5 0.8s ease-in-out infinite; }

    .b1d { animation: bounce1 1.2s ease-in-out infinite 0.3s; }
    .b2d { animation: bounce2 0.9s ease-in-out infinite 0.4s; }
    .b3d { animation: bounce3 1.4s ease-in-out infinite 0.2s; }
    .b4d { animation: bounce4 1.1s ease-in-out infinite 0.5s; }
    .b5d { animation: bounce5 0.8s ease-in-out infinite 0.25s; }
  </style>

  <g filter="url(#glow)" fill="url(#eqGrad)" rx="3">
    <!-- Channel Left (Stereo L) -->
    <rect x="70"  width="6" rx="3" class="b1" />
    <rect x="84"  width="6" rx="3" class="b3" />
    <rect x="98"  width="6" rx="3" class="b2" />
    <rect x="112" width="6" rx="3" class="b4" />
    <rect x="126" width="6" rx="3" class="b5" />
    <rect x="140" width="6" rx="3" class="b1d" />
    <rect x="154" width="6" rx="3" class="b3d" />
    <rect x="168" width="6" rx="3" class="b2d" />
    <rect x="182" width="6" rx="3" class="b5d" />
    <rect x="196" width="6" rx="3" class="b4d" />
    <rect x="210" width="6" rx="3" class="b1" />
    <rect x="224" width="6" rx="3" class="b3" />

    <!-- Center Bridge (Peak Dynamics) -->
    <rect x="250" width="8" rx="4" class="b4" />
    <rect x="268" width="8" rx="4" class="b3d" />
    <rect x="286" width="8" rx="4" class="b2" />
    <rect x="304" width="8" rx="4" class="b4d" />
    <rect x="322" width="8" rx="4" class="b3" />
    <rect x="340" width="8" rx="4" class="b5d" />
    <rect x="358" width="8" rx="4" class="b1d" />
    <rect x="376" width="8" rx="4" class="b4" />

    <!-- Channel Right (Stereo R) -->
    <rect x="402" width="6" rx="3" class="b2" />
    <rect x="416" width="6" rx="3" class="b1d" />
    <rect x="430" width="6" rx="3" class="b4d" />
    <rect x="444" width="6" rx="3" class="b5" />
    <rect x="458" width="6" rx="3" class="b3d" />
    <rect x="472" width="6" rx="3" class="b2d" />
    <rect x="486" width="6" rx="3" class="b1" />
    <rect x="500" width="6" rx="3" class="b4" />
    <rect x="514" width="6" rx="3" class="b3" />
    <rect x="528" width="6" rx="3" class="b5d" />
    <rect x="542" width="6" rx="3" class="b2" />
    <rect x="556" width="6" rx="3" class="b1d" />
  </g>
</svg>
