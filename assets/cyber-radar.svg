<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 130" width="100%" height="110">
  <defs>
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#4C1D95" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </linearGradient>
    <filter id="radarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes blipPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes scanline {
      0% { transform: translateY(0); opacity: 0.1; }
      50% { opacity: 0.4; }
      100% { transform: translateY(120px); opacity: 0.1; }
    }
    @keyframes textPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .scanner-arm {
      transform-origin: 75px 65px;
      animation: radarSpin 4s linear infinite;
    }
    .blip-1 {
      animation: blipPulse 1.8s ease-in-out infinite;
      transform-origin: 60px 45px;
    }
    .blip-2 {
      animation: blipPulse 2.3s ease-in-out infinite 0.7s;
      transform-origin: 95px 75px;
    }
    .blip-3 {
      animation: blipPulse 1.5s ease-in-out infinite 1.2s;
      transform-origin: 50px 85px;
    }
    .hud-text {
      font-family: 'Courier New', Courier, monospace;
      animation: textPulse 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Background HUD Panel -->
  <rect x="10" y="10" width="680" height="110" rx="8" fill="#0D1117" stroke="#1F2937" stroke-width="1.5" />
  <rect x="14" y="14" width="672" height="102" rx="6" fill="#13111C" opacity="0.6" />

  <!-- Corner Brackets -->
  <path d="M 18 30 L 18 18 L 30 18" stroke="#8B5CF6" stroke-width="2" fill="none" />
  <path d="M 682 30 L 682 18 L 670 18" stroke="#8B5CF6" stroke-width="2" fill="none" />
  <path d="M 18 100 L 18 112 L 30 112" stroke="#8B5CF6" stroke-width="2" fill="none" />
  <path d="M 682 100 L 682 112 L 670 112" stroke="#8B5CF6" stroke-width="2" fill="none" />

  <!-- RADAR SCOPE -->
  <g>
    <!-- Concentric Rings -->
    <circle cx="75" cy="65" r="48" fill="#090D16" stroke="#4C1D95" stroke-width="1.2" opacity="0.8" />
    <circle cx="75" cy="65" r="34" fill="none" stroke="#6D28D9" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <circle cx="75" cy="65" r="18" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.5" />
    <circle cx="75" cy="65" r="3" fill="#EC4899" filter="url(#radarGlow)" />

    <!-- Crosshairs -->
    <line x1="27" y1="65" x2="123" y2="65" stroke="#4C1D95" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="75" y1="17" x2="75" y2="113" stroke="#4C1D95" stroke-width="1" stroke-dasharray="2,2" />

    <!-- Rotating Sweep Arm -->
    <g class="scanner-arm">
      <path d="M 75 65 L 123 65 A 48 48 0 0 0 109 31 Z" fill="url(#radarSweep)" />
      <line x1="75" y1="65" x2="123" y2="65" stroke="#A78BFA" stroke-width="1.5" filter="url(#radarGlow)" />
    </g>

    <!-- Radar Target Blips -->
    <circle cx="60" cy="45" r="2.5" fill="#38BDF8" filter="url(#radarGlow)" class="blip-1" />
    <circle cx="95" cy="75" r="2.5" fill="#10B981" filter="url(#radarGlow)" class="blip-2" />
    <circle cx="50" cy="85" r="2.5" fill="#EC4899" filter="url(#radarGlow)" class="blip-3" />
  </g>

  <!-- TELEMETRY HUD DATA -->
  <g class="hud-text" fill="#94A3B8" font-size="11">
    <text x="145" y="38" fill="#A78BFA" font-weight="bold" font-size="13">GOTHAM SECURITY PERIMETER // NODE-7</text>
    <text x="145" y="58">DEFENSE GRID : <tspan fill="#10B981" font-weight="bold">ONLINE [100% INTEGRITY]</tspan></text>
    <text x="145" y="76">ACTIVE SUITE : <tspan fill="#38BDF8">SECURE-FILE-VAULT • PASS-SHIELD • TRUST-LENS</tspan></text>
    <text x="145" y="94">COGNITIVE AI : <tspan fill="#EC4899">CURSOR + CLAUDE + ANTIGRAVITY ORCHESTRATION</tspan></text>

    <!-- Right Side Status Markers -->
    <text x="510" y="38" fill="#E2E8F0" font-size="10">SYS_TIME: <tspan fill="#F59E0B">2026.09-LIVE</tspan></text>
    <text x="510" y="58" fill="#E2E8F0" font-size="10">ENCRYPTION: <tspan fill="#8B5CF6">AES-256-CBC</tspan></text>
    <text x="510" y="76" fill="#E2E8F0" font-size="10">INTEGRITY: <tspan fill="#10B981">HMAC-SHA256</tspan></text>
    <text x="510" y="94" fill="#E2E8F0" font-size="10">AUTH STATUS: <tspan fill="#38BDF8">VERIFIED</tspan></text>
  </g>
</svg>
