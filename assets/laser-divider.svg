<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="100%" height="20">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0" />
      <stop offset="15%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0" />
      <stop offset="40%" stop-color="#EC4899" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes laserGlide {
      0% { transform: translateX(0px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(760px); opacity: 0; }
    }
    @keyframes pulseLine {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .base-line {
      animation: pulseLine 3s ease-in-out infinite;
    }
    .laser-bead {
      animation: laserGlide 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Background Base Track -->
  <line x1="50" y1="10" x2="850" y2="10" stroke="url(#lineGrad)" stroke-width="2" class="base-line" />
  
  <!-- Central Pulse Diamond -->
  <polygon points="450,5 455,10 450,15 445,10" fill="#EC4899" filter="url(#neonGlow)" />
  <circle cx="450" cy="10" r="1.5" fill="#FFFFFF" />

  <!-- Scanning Laser Bead -->
  <g class="laser-bead">
    <ellipse cx="70" cy="10" rx="35" ry="3" fill="url(#glowGrad)" filter="url(#neonGlow)" />
    <circle cx="70" cy="10" r="2" fill="#FFFFFF" />
  </g>
</svg>
